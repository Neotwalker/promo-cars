<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="NEXROUTE AUTO — подбор и доставка автомобилей из Китая в Россию">
  <title>NEXROUTE AUTO — автомобили из Китая</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="shell site-header__inner">
      <a class="site-header__brand" href="#hero" aria-label="NEXROUTE AUTO — на первый экран">NEXROUTE AUTO</a>
      <div class="site-header__menu-mark" aria-hidden="true">
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="hero">
      <div class="hero__media" id="hero-media" aria-hidden="true">
        <video
          class="hero__video"
          muted
          loop
          playsinline
          preload="metadata"
          poster="./assets/hero/hero-poster.webp"
          data-hero-video
        >
          <source src="./assets/hero/hero-loop-template.mp4" type="video/mp4">
        </video>
      </div>

      <div class="hero__shade" aria-hidden="true"></div>

      <div class="shell hero__inner">
        <div class="hero__copy">
          <p class="hero__eyebrow">Автомобили из Китая → Россия</p>
          <h1>Вы выбираете<br>автомобиль.<br>Остальное —<br>маршрут.</h1>
          <p class="hero__lead">Подбор, проверка, выкуп, логистика и оформление — в одном маршруте. До старта фиксируем расчёт и показываем, из чего складывается цена.</p>
          <div class="hero__actions" aria-label="Основные действия">
            <span class="hero-button hero-button--primary">Получить расчёт <i aria-hidden="true">→</i></span>
            <span class="hero-button hero-button--ghost">Смотреть маршрут <i aria-hidden="true">→</i></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
