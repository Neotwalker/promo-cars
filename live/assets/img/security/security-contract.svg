<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030">
<style>
  .brand{font:700 22px Arial,sans-serif;fill:#171b1f;letter-spacing:2.2px}
  .accent{fill:#ff5b35}
  .eyebrow{font:700 12px Arial,sans-serif;fill:#858783;letter-spacing:1.5px}
  .title{font:700 56px Georgia,'Times New Roman',serif;fill:#171b1f}
  .subtitle{font:400 17px Arial,sans-serif;fill:#6d706d}
  .roman{font:700 14px Georgia,'Times New Roman',serif;fill:#ff5b35}
  .toc{font:400 19px Georgia,'Times New Roman',serif;fill:#272a28}
  .page{font:400 13px Arial,sans-serif;fill:#92938f}
  .small{font:400 12px Arial,sans-serif;fill:#858783}
</style>
<rect width="1280" height="1030" fill="#fdfdfb"/>
<rect width="1280" height="8" fill="#ff5b35"/>

<text x="82" y="76" class="brand">NEXROUTE <tspan class="accent">AUTO</tspan></text>
<text x="82" y="111" class="eyebrow">УСЛОВИЯ СОПРОВОЖДЕНИЯ СДЕЛКИ</text>

<text x="82" y="210" class="title">Договор</text>
<text x="82" y="272" class="title">на сопровождение сделки</text>
<text x="82" y="318" class="subtitle">Условия покупки, оплаты, проверки, доставки и выдачи автомобиля.</text>

<line x1="82" y1="366" x2="1198" y2="366" stroke="#d3d3cf" stroke-width="2"/>

<text x="82" y="432" class="roman">I</text>
<text x="154" y="432" class="toc">Предмет договора</text>
<text x="1188" y="432" class="page" text-anchor="end">01</text>
<line x1="82" y1="464" x2="1198" y2="464" stroke="#e3e3df"/>

<text x="82" y="526" class="roman">II</text>
<text x="154" y="526" class="toc">Стоимость услуг и порядок платежей</text>
<text x="1188" y="526" class="page" text-anchor="end">03</text>
<line x1="82" y1="558" x2="1198" y2="558" stroke="#e3e3df"/>

<text x="82" y="620" class="roman">III</text>
<text x="154" y="620" class="toc">Действия при неуспешной проверке</text>
<text x="1188" y="620" class="page" text-anchor="end">05</text>
<line x1="82" y1="652" x2="1198" y2="652" stroke="#e3e3df"/>

<text x="82" y="714" class="roman">IV</text>
<text x="154" y="714" class="toc">Ответственность на маршруте и страхование</text>
<text x="1188" y="714" class="page" text-anchor="end">07</text>
<line x1="82" y1="746" x2="1198" y2="746" stroke="#e3e3df"/>

<text x="82" y="808" class="roman">V</text>
<text x="154" y="808" class="toc">Комплект документов на выдаче</text>
<text x="1188" y="808" class="page" text-anchor="end">10</text>

<line x1="82" y1="900" x2="1198" y2="900" stroke="#d9d9d5"/>
<text x="82" y="944" class="small">NEXROUTE AUTO</text>
<line x1="532" y1="940" x2="680" y2="940" stroke="#bebfbb"/>
<text x="1198" y="944" class="small" text-anchor="end">Сопровождение сделки</text>
</svg>