name: One-time final CTA sticky overflow fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'fix final CTA sticky overflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve clipping without breaking sticky
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('live/styles.css')
          css = path.read_text()
          old = '''.final-cta{
            position:relative;
            overflow:hidden;
            padding:var(--space-section) 0;'''
          new = '''.final-cta{
            position:relative;
            overflow:clip;
            padding:var(--space-section) 0;'''
          if old not in css:
              raise SystemExit('Current final CTA overflow rule not found')
          css = css.replace(old, new, 1)
          path.write_text(css)
          PY

      - name: Verify sticky behavior in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 1
          cat > sticky-test.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!executablePath) throw new Error('System Chrome/Chromium not found');

          const browser = await chromium.launch({headless:true, executablePath, args:['--no-sandbox','--disable-dev-shm-usage']});
          const context = await browser.newContext({viewport:{width:1440,height:900}});
          const page = await context.newPage();
          const errors = [];
          page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
          page.on('pageerror', err => errors.push(String(err)));
          await page.goto('http://127.0.0.1:8080/live/', {waitUntil:'load'});

          const section = page.locator('.final-cta');
          const intro = page.locator('.final-cta__intro');
          const computed = await Promise.all([
            section.evaluate(el => getComputedStyle(el).overflow),
            intro.evaluate(el => ({position:getComputedStyle(el).position, top:getComputedStyle(el).top}))
          ]);
          if (computed[0] !== 'clip') throw new Error(`Final CTA overflow is ${computed[0]}`);
          if (computed[1].position !== 'sticky') throw new Error(`Intro position is ${computed[1].position}`);

          const sectionTop = await section.evaluate(el => el.getBoundingClientRect().top + window.scrollY);
          await page.evaluate(y => window.scrollTo(0, y), sectionTop + 220);
          await page.waitForTimeout(100);
          const metrics = await intro.evaluate(el => ({top:el.getBoundingClientRect().top, height:el.getBoundingClientRect().height}));
          const expectedTop = 96;
          if (Math.abs(metrics.top - expectedTop) > 3) {
            throw new Error(`Sticky intro did not clamp: top=${metrics.top}, expected≈${expectedTop}`);
          }
          if (errors.length) throw new Error(`Console errors: ${errors.join(' | ')}`);
          console.log(JSON.stringify({computed, sectionTop, metrics}));

          await context.close();
          await browser.close();
          JS
          node sticky-test.mjs

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/styles.css
          git commit -m "fix final CTA sticky containment"
          git push origin HEAD:main
