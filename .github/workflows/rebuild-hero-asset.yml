name: Rebuild Hero Asset

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-hero-asset.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify Hero asset
        shell: bash
        run: |
          set -euo pipefail
          cat             tools/hero-asset/part1.b64             tools/hero-asset/part2.b64             tools/hero-asset/part3.b64             tools/hero-asset/part4.b64             tools/hero-asset/part5.b64             | base64 --decode > live/assets/hero/nexroute-garage-stage-v2.avif

          test "$(wc -c < live/assets/hero/nexroute-garage-stage-v2.avif)" -eq 16732

          actual_sha="$(git hash-object live/assets/hero/nexroute-garage-stage-v2.avif)"
          expected_sha="a8acd1584801fd7d2c1581f4eb01add8f1f1945c"

          echo "Hero asset SHA: $actual_sha"
          test "$actual_sha" = "$expected_sha"
          file live/assets/hero/nexroute-garage-stage-v2.avif

      - name: Commit verified Hero asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/assets/hero/nexroute-garage-stage-v2.avif
          git commit -m "[hero-asset] rebuild approved Hero background"
          git push
