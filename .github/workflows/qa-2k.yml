name: One-time 2K visual QA

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    if: github.event.head_commit.message == 'run one-time 2k visual QA'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright core
        run: npm install --no-save playwright-core

      - name: Start local server
        run: |
          python3 -m http.server 8080 > /tmp/promo-cars-server.log 2>&1 &
          echo $! > /tmp/promo-cars-server.pid
          sleep 1

      - name: Run 2K visual QA
        shell: bash
        run: |
          mkdir -p qa-2k/screens
          cat > /tmp/qa-2k.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const candidates = [
            '/usr/bin/google-chrome',
            '/usr/bin/google-chrome-stable',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser'
          ];
          const executablePath = candidates.find((p) => fs.existsSync(p));
          if (!executablePath) throw new Error('System Chrome/Chromium not found');

          const browser = await chromium.launch({
            headless: true,
            executablePath,
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });

          const context = await browser.newContext({
            viewport: { width: 2560, height: 1440 },
            deviceScaleFactor: 1,
            reducedMotion: 'no-preference'
          });
          const page = await context.newPage();

          const consoleErrors = [];
          const pageErrors = [];
          const badResponses = [];
          page.on('console', (msg) => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });
          page.on('pageerror', (error) => pageErrors.push(String(error)));
          page.on('response', (response) => {
            if (response.status() >= 400) badResponses.push({ status: response.status(), url: response.url() });
          });

          const base = 'http://127.0.0.1:8080/live/';
          await page.goto(base, { waitUntil: 'load', timeout: 60000 });
          await page.waitForTimeout(1800);

          await page.screenshot({ path: 'qa-2k/screens/hero.png' });

          const ids = ['cars', 'journey', 'configurator', 'proof', 'security', 'faq', 'final-calculation'];
          const sectionMetrics = [];
          for (const id of ids) {
            const el = page.locator(`#${id}`);
            if (await el.count()) {
              await el.scrollIntoViewIfNeeded();
              await page.waitForTimeout(700);
              const metrics = await el.evaluate((node) => {
                const r = node.getBoundingClientRect();
                return {
                  id: node.id,
                  top: Math.round(r.top),
                  left: Math.round(r.left),
                  width: Math.round(r.width),
                  height: Math.round(r.height)
                };
              });
              sectionMetrics.push(metrics);
              await page.screenshot({ path: `qa-2k/screens/${id}.png` });
            }
          }

          await page.screenshot({ path: 'qa-2k/screens/full-page.png', fullPage: true });

          const layout = await page.evaluate(() => {
            const visible = (el) => {
              const cs = getComputedStyle(el);
              const r = el.getBoundingClientRect();
              return cs.display !== 'none' && cs.visibility !== 'hidden' && Number(cs.opacity) !== 0 && r.width > 1 && r.height > 1;
            };
            const selectorFor = (el) => {
              if (el.id) return `#${el.id}`;
              const cls = [...el.classList].slice(0, 3).join('.');
              return `${el.tagName.toLowerCase()}${cls ? '.' + cls : ''}`;
            };
            const overflow = [];
            for (const el of document.querySelectorAll('body *')) {
              if (!visible(el)) continue;
              const r = el.getBoundingClientRect();
              if (r.left < -3 || r.right > innerWidth + 3) {
                overflow.push({
                  selector: selectorFor(el),
                  left: Math.round(r.left),
                  right: Math.round(r.right),
                  width: Math.round(r.width)
                });
              }
            }
            const brokenImages = [...document.images]
              .filter((img) => img.complete && img.currentSrc && img.naturalWidth === 0)
              .map((img) => img.currentSrc);
            return {
              viewport: { width: innerWidth, height: innerHeight },
              document: {
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                scrollHeight: document.documentElement.scrollHeight
              },
              horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2,
              overflowElements: overflow.slice(0, 100),
              brokenImages,
              fonts: {
                body: getComputedStyle(document.body).fontFamily,
                h1: getComputedStyle(document.querySelector('h1')).fontFamily
              }
            };
          });

          const standalone = [];
          for (const file of ['privacy-policy.html', 'personal-data-consent.html', '404.html']) {
            await page.goto(base + file, { waitUntil: 'load', timeout: 60000 });
            await page.waitForTimeout(500);
            const info = await page.evaluate(() => ({
              title: document.title,
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              scrollHeight: document.documentElement.scrollHeight
            }));
            standalone.push({ file, ...info, horizontalOverflow: info.scrollWidth > info.clientWidth + 2 });
            await page.screenshot({ path: `qa-2k/screens/${file.replace('.html','')}.png`, fullPage: true });
          }

          const report = {
            url: base,
            viewport: '2560x1440',
            sectionMetrics,
            layout,
            standalone,
            consoleErrors,
            pageErrors,
            badResponses
          };
          fs.writeFileSync('qa-2k/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          JS

          node /tmp/qa-2k.mjs

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-2k
          path: qa-2k
          if-no-files-found: error
