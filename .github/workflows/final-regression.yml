name: One-time final demo regression

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    if: github.event.head_commit.message == 'run final demo regression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check live/app.js
          node --check ui-kit/app.js
          node --check live/final-gradient.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          root = Path('.')
          pages = [
              Path('live/index.html'),
              Path('live/privacy-policy.html'),
              Path('live/personal-data-consent.html'),
              Path('live/404.html'),
              Path('404.html'),
          ]

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
                  self.refs=[]
                  self.local=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.append(a['id'])
                  for key in ('aria-controls','aria-labelledby','aria-describedby'):
                      if a.get(key):
                          self.refs.extend((key,x) for x in a[key].split())
                  for key in ('href','src'):
                      v=a.get(key)
                      if v: self.local.append((key,v))

          for page in pages:
              text=page.read_text()
              p=Audit(); p.feed(text)
              dup=sorted({x for x in p.ids if p.ids.count(x)>1})
              if dup: raise SystemExit(f'{page}: duplicate IDs {dup}')
              ids=set(p.ids)
              missing=[(k,v) for k,v in p.refs if v not in ids]
              if missing: raise SystemExit(f'{page}: missing ARIA refs {missing[:20]}')
              for key,v in p.local:
                  if v.startswith(('#','http:','https:','mailto:','tel:','data:','javascript:')): continue
                  clean=v.split('#')[0].split('?')[0]
                  if page.name == '404.html' and page.parent == Path('.') and clean.startswith('/promo-cars/'):
                      target=(root / clean.removeprefix('/promo-cars/')).resolve()
                  else:
                      target=(page.parent / clean).resolve()
                  if not target.exists(): raise SystemExit(f'{page}: broken {key}={v} -> {target}')

          html=Path('live/index.html').read_text()
          journey=re.findall(r'<img\b[^>]*data-src="\.\/assets\/img\/journey\/journey-[1-8]\.webp"[^>]*>',html)
          if len(journey)!=8: raise SystemExit(f'Journey image count={len(journey)}, expected 8')
          if any(re.search(r'\ssrc="\.\/assets\/img\/journey\/',x) for x in journey):
              raise SystemExit('Journey has eager direct src')
          proof=re.findall(r'<img\b[^>]*data-src="\.\/assets\/img\/proof\/proof-(?:zeekr-001|xiaomi-su7|li-auto-l6)-1440\.webp"[^>]*>',html)
          if len(proof)!=3: raise SystemExit(f'Proof deferred image count={len(proof)}, expected 3')
          if any(re.search(r'\ssrc="\.\/assets\/img\/proof\/',x) for x in proof):
              raise SystemExit('Proof has eager direct src')

          for name in ('live/styles.css','ui-kit/styles.css'):
              css=Path(name).read_text()
              depth=minimum=0
              for ch in css:
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1; minimum=min(minimum,depth)
              if depth or minimum<0: raise SystemExit(f'{name} braces invalid: depth={depth}, min={minimum}')

          print('STATIC_OK')
          PY

      - name: Browser regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 1
          cat > /tmp/final-regression.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!executablePath) throw new Error('System Chrome/Chromium not found');
          const browser = await chromium.launch({headless:true, executablePath, args:['--no-sandbox','--disable-dev-shm-usage']});
          const base='http://127.0.0.1:8080';

          async function newPage(width=1440,height=900){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage();
            const errors=[];
            const badResponses=[];
            page.on('console',m=>{ if(m.type()==='error') errors.push(`console: ${m.text()}`); });
            page.on('pageerror',e=>errors.push(`pageerror: ${e}`));
            page.on('response',r=>{ if(r.status()>=400) badResponses.push(`${r.status()} ${r.url()}`); });
            return {context,page,errors,badResponses};
          }
          function assert(cond,msg){ if(!cond) throw new Error(msg); }

          {
            const {context,page,errors,badResponses}=await newPage(1440,900);
            const initialRequests=[];
            page.on('request',r=>initialRequests.push(r.url()));
            await page.goto(`${base}/live/`,{waitUntil:'load'});
            await page.waitForTimeout(600);

            assert(!initialRequests.some(u=>/\/journey\/journey-[1-8]\.webp/.test(u)),'Journey requested in Hero');
            assert(!initialRequests.some(u=>/\/proof\/proof-(zeekr-001|xiaomi-su7|li-auto-l6)-/.test(u)),'Proof requested in Hero');

            const rootWidth=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            assert(rootWidth.sw<=rootWidth.cw+1,`desktop horizontal overflow ${JSON.stringify(rootWidth)}`);

            const menu=page.locator('[data-menu-toggle]');
            await menu.click();
            assert(await menu.getAttribute('aria-expanded')==='true','burger did not open');
            assert(!(await page.locator('[data-menu-panel]').getAttribute('hidden')),'menu panel still hidden');
            await menu.click();
            assert(await menu.getAttribute('aria-expanded')==='false','burger did not close');

            const filterTrigger=page.locator('[data-car-filter-trigger]');
            await filterTrigger.click();
            await page.locator('[data-car-filter="electric"]').click();
            assert((await page.locator('[data-car-filter-label]').textContent())?.trim()==='Электромобили','Cars filter label mismatch');
            assert(await page.locator('[data-car-card]:visible').count()>=1,'Cars filter hid all cards');

            const sortTrigger=page.locator('[data-car-sort-trigger]');
            await sortTrigger.click();
            await page.locator('[data-car-sort-option="price-asc"]').click();
            assert((await page.locator('[data-car-sort-label]').textContent())?.trim()==='Сначала дешевле','Cars sort label mismatch');

            await page.locator('#journey').scrollIntoViewIfNeeded();
            await page.waitForTimeout(350);
            const journeyDisplay=await page.locator('.journey__visual').first().evaluate(el=>getComputedStyle(el).display);
            assert(journeyDisplay!=='none','Journey visual hidden on desktop');
            await page.waitForFunction(()=>document.querySelector('.journey__visual img')?.getAttribute('src'));

            await page.locator('#configurator').scrollIntoViewIfNeeded();
            const beforeStep=await page.locator('.configurator__step--active').getAttribute('data-config-step');
            await page.locator('[data-config-next]').click();
            await page.waitForTimeout(80);
            const afterStep=await page.locator('.configurator__step--active').getAttribute('data-config-step');
            assert(beforeStep!==afterStep,`Configurator did not advance from ${beforeStep}`);
            await page.locator('[data-config-back]').click();
            await page.waitForTimeout(80);
            assert(await page.locator('.configurator__step--active').getAttribute('data-config-step')===beforeStep,'Configurator back failed');

            await page.locator('#proof').scrollIntoViewIfNeeded();
            await page.waitForTimeout(900);
            const firstCase=page.locator('[data-proof-case]').first();
            const caseToggle=firstCase.locator('[data-case-toggle]');
            await caseToggle.click();
            await page.waitForTimeout(100);
            assert(await caseToggle.getAttribute('aria-expanded')==='true','Proof case did not expand');
            const controls=await caseToggle.getAttribute('aria-controls');
            assert(controls && await page.locator(`#${controls}`).count()===1,'Proof details aria-controls missing/dangling');
            await caseToggle.click();
            assert(await caseToggle.getAttribute('aria-expanded')==='false','Proof case did not collapse');

            await page.locator('[data-modal-open="security-document-modal"]').click();
            const securityModal=page.locator('#security-document-modal');
            assert(await securityModal.getAttribute('aria-hidden')==='false','Security modal did not open');
            await securityModal.locator('[data-modal-close]').click();
            assert(await securityModal.getAttribute('aria-hidden')==='true','Security modal did not close');

            await page.locator('[data-modal-open="car-lead-modal"]').first().click();
            const leadModal=page.locator('#car-lead-modal');
            assert(await leadModal.getAttribute('aria-hidden')==='false','Lead modal did not open');
            await leadModal.locator('button[type="submit"]').click();
            await page.waitForTimeout(80);
            assert(await leadModal.locator('[aria-invalid="true"]').count()>=1,'Lead form validation did not mark invalid fields');
            await leadModal.locator('[data-modal-close]').click();

            const faq2=page.locator('[data-accordion]').nth(1);
            await faq2.locator('[data-accordion-trigger]').click();
            assert(await faq2.getAttribute('open')!==null,'FAQ did not open');
            await faq2.locator('[data-accordion-trigger]').click();
            assert(await faq2.getAttribute('open')===null,'FAQ did not close');

            const finalSection=page.locator('#final-calculation');
            await finalSection.scrollIntoViewIfNeeded();
            await page.locator('[data-final-form] button[type="submit"]').click();
            await page.waitForTimeout(100);
            assert(await page.locator('[data-final-form] [aria-invalid="true"]').count()>=1,'Final form validation did not mark invalid fields');
            assert((await page.locator('[data-final-consent-message]').textContent())?.trim().length>0,'Final consent validation message missing');

            const sectionTop=await finalSection.evaluate(el=>el.getBoundingClientRect().top+window.scrollY);
            await page.evaluate(y=>window.scrollTo(0,y),sectionTop+220);
            await page.waitForTimeout(100);
            const sticky=await page.locator('.final-cta__intro').evaluate(el=>({position:getComputedStyle(el).position,top:el.getBoundingClientRect().top,cssTop:getComputedStyle(el).top}));
            assert(sticky.position==='sticky','Final CTA intro is not sticky on desktop');
            assert(Math.abs(sticky.top-96)<=4,`Final CTA sticky top mismatch ${JSON.stringify(sticky)}`);

            assert(errors.length===0,`Desktop errors: ${errors.join(' | ')}`);
            assert(badResponses.length===0,`Desktop HTTP errors: ${badResponses.join(' | ')}`);
            console.log('DESKTOP_OK',JSON.stringify({rootWidth,sticky}));
            await context.close();
          }

          {
            const {context,page,errors,badResponses}=await newPage(1024,900);
            const req=[]; page.on('request',r=>req.push(r.url()));
            await page.goto(`${base}/live/`,{waitUntil:'load'});
            await page.locator('#journey').scrollIntoViewIfNeeded();
            await page.waitForTimeout(600);
            const display=await page.locator('.journey__visual').first().evaluate(el=>getComputedStyle(el).display);
            assert(display==='none',`Journey visual visible at 1024: ${display}`);
            assert(!req.some(u=>/\/journey\/journey-[1-8]\.webp/.test(u)),'Journey image requested at 1024');
            assert(errors.length===0,`1024 errors: ${errors.join(' | ')}`);
            assert(badResponses.length===0,`1024 HTTP errors: ${badResponses.join(' | ')}`);
            console.log('TABLET_OK');
            await context.close();
          }

          {
            const {context,page,errors,badResponses}=await newPage(390,844);
            await page.goto(`${base}/live/`,{waitUntil:'load'});
            const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            assert(dims.sw<=dims.cw+1,`mobile horizontal overflow ${JSON.stringify(dims)}`);
            await page.locator('[data-menu-toggle]').click();
            assert(await page.locator('[data-menu-toggle]').getAttribute('aria-expanded')==='true','mobile burger failed');
            await page.locator('[data-menu-toggle]').click();
            await page.locator('[data-modal-open="car-lead-modal"]').first().click();
            const box=await page.locator('#car-lead-modal [data-modal-dialog]').boundingBox();
            assert(box && Math.abs(box.width-390)<=2,`mobile modal width mismatch ${JSON.stringify(box)}`);
            await page.locator('#car-lead-modal [data-modal-close]').click();
            await page.locator('#final-calculation').scrollIntoViewIfNeeded();
            const position=await page.locator('.final-cta__intro').evaluate(el=>getComputedStyle(el).position);
            assert(position==='static',`Final CTA intro should be static on mobile, got ${position}`);
            assert(errors.length===0,`Mobile errors: ${errors.join(' | ')}`);
            assert(badResponses.length===0,`Mobile HTTP errors: ${badResponses.join(' | ')}`);
            console.log('MOBILE_OK');
            await context.close();
          }

          for (const path of ['/live/privacy-policy.html','/live/personal-data-consent.html','/live/404.html','/404.html']) {
            const {context,page,errors,badResponses}=await newPage(390,844);
            const response=await page.goto(base+path,{waitUntil:'load'});
            assert(response?.status()===200,`${path} status ${response?.status()}`);
            const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            assert(dims.sw<=dims.cw+1,`${path} horizontal overflow ${JSON.stringify(dims)}`);
            assert(errors.length===0,`${path} errors: ${errors.join(' | ')}`);
            assert(badResponses.length===0,`${path} HTTP errors: ${badResponses.join(' | ')}`);
            console.log('PAGE_OK',path);
            await context.close();
          }

          await browser.close();
          console.log('FINAL_REGRESSION_OK');
          JS
          node /tmp/final-regression.mjs
