name: One-time final CTA sticky intro

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'make final CTA intro sticky'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make final CTA intro sticky
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('live/styles.css')
          css = path.read_text()

          css, base_count = re.subn(
              r'\.final-cta__intro\{max-width:42rem\}',
              '.final-cta__intro{\n  position:sticky;\n  top:calc(var(--header-h) + var(--space-4));\n  align-self:start;\n  max-width:42rem;\n}',
              css,
              count=1
          )
          if base_count != 1:
              raise SystemExit(f'Expected one base final CTA intro rule, changed {base_count}')

          final_start = css.find('.final-cta__intro{')
          media_start = css.find('@media(max-width:72rem){', final_start)
          media_end = css.find('@media(max-width:48rem){', media_start)
          if final_start < 0 or media_start < 0 or media_end < 0:
              raise SystemExit('Final CTA responsive media block not found')

          media = css[media_start:media_end]
          media, responsive_count = re.subn(
              r'  \.final-cta__intro\{\s*max-width:46rem;\s*\}',
              '  .final-cta__intro{\n    position:static;\n    top:auto;\n    align-self:auto;\n    max-width:46rem;\n  }',
              media,
              count=1
          )
          if responsive_count != 1:
              raise SystemExit(f'Expected one responsive final CTA intro rule, changed {responsive_count}')
          css = css[:media_start] + media + css[media_end:]

          depth = 0
          minimum = 0
          for ch in css:
              if ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  minimum = min(minimum, depth)
          if depth != 0 or minimum < 0:
              raise SystemExit(f'CSS braces invalid: depth={depth}, minimum={minimum}')

          path.write_text(css)
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/styles.css
          git commit -m "make final CTA intro sticky on desktop"
          git push origin HEAD:main
