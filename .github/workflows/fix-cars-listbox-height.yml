name: One-time Cars listbox height fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'limit cars listbox height'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Limit Cars listbox height
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ui-kit/styles.css')
          css = path.read_text()
          selector = '.cars__filter-menu,\n.cars__sort-menu{'
          start = css.find(selector)
          if start < 0:
              raise SystemExit('Cars listbox menu block not found')
          end = css.find('\n}', start)
          if end < 0:
              raise SystemExit('Cars listbox menu block end not found')
          block = css[start:end]
          if 'max-height:' not in block:
              insertion = '\n  max-height:min(20rem,calc(100dvh - 7rem));\n  overflow-y:auto;\n  overscroll-behavior:contain;'
              css = css[:end] + insertion + css[end:]
          path.write_text(css)

          updated = path.read_text()
          start = updated.find(selector)
          end = updated.find('\n}', start)
          block = updated[start:end]
          required = [
              'max-height:min(20rem,calc(100dvh - 7rem));',
              'overflow-y:auto;',
              'overscroll-behavior:contain;'
          ]
          missing = [item for item in required if item not in block]
          if missing:
              raise SystemExit(f'Missing Cars listbox rules: {missing}')
          PY

      - name: Test listbox height across breakpoints
        shell: bash
        run: |
          npm install --no-save playwright-core
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 1
          cat > listbox-test.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!executablePath) throw new Error('System Chrome/Chromium not found');
          const browser = await chromium.launch({headless:true, executablePath, args:['--no-sandbox','--disable-dev-shm-usage']});

          for (const width of [1440, 1024, 768, 430, 390, 360]) {
            const context = await browser.newContext({viewport:{width,height:900}});
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:8080/live/', {waitUntil:'load'});
            await page.locator('[data-car-filter-trigger]').click();
            const filter = await page.locator('[data-car-filter-menu]').evaluate((node) => {
              const s = getComputedStyle(node);
              return {maxHeight:s.maxHeight, overflowY:s.overflowY, clientHeight:node.clientHeight, scrollHeight:node.scrollHeight};
            });
            await page.locator('[data-car-filter-trigger]').click();
            await page.locator('[data-car-sort-trigger]').click();
            const sort = await page.locator('[data-car-sort-menu]').evaluate((node) => {
              const s = getComputedStyle(node);
              return {maxHeight:s.maxHeight, overflowY:s.overflowY, clientHeight:node.clientHeight, scrollHeight:node.scrollHeight};
            });
            if (filter.overflowY !== 'auto' || sort.overflowY !== 'auto') throw new Error(`${width}px overflow-y mismatch`);
            if (filter.maxHeight === 'none' || sort.maxHeight === 'none') throw new Error(`${width}px max-height missing`);
            console.log(JSON.stringify({width,filter,sort}));
            await context.close();
          }
          await browser.close();
          JS
          node listbox-test.mjs

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-kit/styles.css
          git commit -m "cap Cars dropdown height"
          git push origin HEAD:main
