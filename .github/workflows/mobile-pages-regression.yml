name: One-time mobile pages regression

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'run mobile pages regression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mobile and standalone checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core
          ln -s . promo-cars
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 1
          cat > mobile-pages.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('System Chrome/Chromium not found');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          const base='http://127.0.0.1:8080'; const assert=(c,m)=>{if(!c)throw new Error(m)};
          async function setup(){const context=await browser.newContext({viewport:{width:390,height:844}});const page=await context.newPage();const errors=[];const bad=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(String(e)));page.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});return{context,page,errors,bad};}

          {
            const {context,page,errors,bad}=await setup(); await page.goto(base+'/live/',{waitUntil:'load'});
            const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})); assert(dims.sw<=dims.cw+1,`Mobile horizontal overflow ${JSON.stringify(dims)}`);
            await page.locator('[data-menu-toggle]').click(); assert(await page.locator('[data-menu-toggle]').getAttribute('aria-expanded')==='true','Mobile menu open failed'); await page.locator('[data-menu-toggle]').click();
            await page.locator('[data-modal-open="car-lead-modal"]').first().click(); await page.waitForTimeout(360);
            const box=await page.locator('#car-lead-modal [data-modal-dialog]').boundingBox(); const clientWidth=await page.evaluate(()=>document.documentElement.clientWidth); assert(box&&Math.abs(box.width-clientWidth)<=2,`Mobile modal width failed: box=${JSON.stringify(box)}, clientWidth=${clientWidth}`);
            await page.locator('#car-lead-modal [data-modal-close]').click(); await page.waitForTimeout(420); assert(await page.locator('#car-lead-modal').getAttribute('aria-hidden')==='true','Mobile modal close failed');
            await page.locator('#final-calculation').scrollIntoViewIfNeeded(); assert(await page.locator('.final-cta__intro').evaluate(el=>getComputedStyle(el).position)==='static','Mobile final intro not static');
            assert(!errors.length,'Mobile console errors: '+errors.join(' | ')); assert(!bad.length,'Mobile HTTP errors: '+bad.join(' | ')); console.log('MOBILE_OK',JSON.stringify({dims,box,clientWidth})); await context.close();
          }

          for(const path of ['/live/privacy-policy.html','/live/personal-data-consent.html','/live/404.html','/404.html']){
            const {context,page,errors,bad}=await setup(); const r=await page.goto(base+path,{waitUntil:'load'}); assert(r?.status()===200,`${path} status ${r?.status()}`); const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})); assert(dims.sw<=dims.cw+1,`${path} horizontal overflow ${JSON.stringify(dims)}`); assert(!errors.length,`${path} console errors: ${errors.join(' | ')}`); assert(!bad.length,`${path} HTTP errors: ${bad.join(' | ')}`); console.log('PAGE_OK',path); await context.close();
          }
          await browser.close(); console.log('MOBILE_PAGES_REGRESSION_OK');
          JS
          node mobile-pages.mjs
