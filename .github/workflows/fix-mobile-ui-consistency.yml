name: One-time mobile UI consistency fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'align mobile controls with UI kit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Cars scrollbars and modal button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('ui-kit/styles.css')
          css = css_path.read_text()

          menu_selector = '.cars__filter-menu,\n.cars__sort-menu{'
          start = css.find(menu_selector)
          if start < 0:
              raise SystemExit('Cars listbox menu block not found')
          end = css.find('\n}', start)
          if end < 0:
              raise SystemExit('Cars listbox menu block end not found')
          block = css[start:end]

          if 'scrollbar-width:thin;' not in block:
              block += '\n  scrollbar-width:thin;\n  scrollbar-color:rgba(16,18,22,.42) transparent;'
              css = css[:start] + block + css[end:]

          scrollbar_rules = (
              '\n.cars__filter-menu::-webkit-scrollbar,\n'
              '.cars__sort-menu::-webkit-scrollbar{\n'
              '  width:.5rem;\n'
              '}\n'
              '.cars__filter-menu::-webkit-scrollbar-track,\n'
              '.cars__sort-menu::-webkit-scrollbar-track{\n'
              '  background:transparent;\n'
              '}\n'
              '.cars__filter-menu::-webkit-scrollbar-thumb,\n'
              '.cars__sort-menu::-webkit-scrollbar-thumb{\n'
              '  min-height:2.5rem;\n'
              '  border:2px solid var(--color-white);\n'
              '  border-radius:999px;\n'
              '  background:rgba(16,18,22,.42);\n'
              '}\n'
              '.cars__filter-menu::-webkit-scrollbar-thumb:hover,\n'
              '.cars__sort-menu::-webkit-scrollbar-thumb:hover{\n'
              '  background:rgba(16,18,22,.62);\n'
              '}\n'
              '.cars__filter-menu::-webkit-scrollbar-button,\n'
              '.cars__sort-menu::-webkit-scrollbar-button{\n'
              '  width:0;\n'
              '  height:0;\n'
              '  display:none;\n'
              '}\n'
          )
          if '.cars__filter-menu::-webkit-scrollbar,' not in css:
              insert_at = css.find('\n.cars__filter-menu{', start)
              if insert_at < 0:
                  raise SystemExit('Cars filter menu specific block not found')
              css = css[:insert_at] + scrollbar_rules + css[insert_at:]

          css_path.write_text(css)

          html_path = Path('live/index.html')
          html = html_path.read_text()
          old = '<button class="button button--signal car-lead-modal__submit" type="submit">'
          new = '<button class="button button--primary button--inverse car-lead-modal__submit" type="submit">'
          if old not in html:
              raise SystemExit('Car lead submit button markup not found')
          html_path.write_text(html.replace(old, new, 1))
          PY

      - name: Validate UI behavior
        shell: bash
        run: |
          npm install --no-save playwright-core
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 1
          cat > mobile-ui-test.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!executablePath) throw new Error('System Chrome/Chromium not found');
          const browser = await chromium.launch({headless:true, executablePath, args:['--no-sandbox','--disable-dev-shm-usage']});

          for (const width of [1440,1024,768,430,390,360]) {
            const context = await browser.newContext({viewport:{width,height:900}});
            const page = await context.newPage();
            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('pageerror', err => errors.push(String(err)));
            await page.goto('http://127.0.0.1:8080/live/', {waitUntil:'load'});

            await page.locator('[data-car-filter-trigger]').click();
            const filter = await page.locator('[data-car-filter-menu]').evaluate((node) => {
              const s = getComputedStyle(node);
              const sb = getComputedStyle(node, '::-webkit-scrollbar');
              const thumb = getComputedStyle(node, '::-webkit-scrollbar-thumb');
              return {maxHeight:s.maxHeight, overflowY:s.overflowY, scrollbarWidth:sb.width, thumbBackground:thumb.backgroundColor};
            });
            if (filter.maxHeight === 'none' || filter.overflowY !== 'auto') throw new Error(`${width}px filter height/overflow mismatch`);
            if (filter.scrollbarWidth === 'auto' || filter.scrollbarWidth === '0px') throw new Error(`${width}px custom filter scrollbar missing: ${JSON.stringify(filter)}`);

            await page.locator('[data-car-filter-trigger]').click();
            await page.locator('[data-car-sort-trigger]').click();
            const sort = await page.locator('[data-car-sort-menu]').evaluate((node) => {
              const s = getComputedStyle(node);
              const sb = getComputedStyle(node, '::-webkit-scrollbar');
              return {maxHeight:s.maxHeight, overflowY:s.overflowY, scrollbarWidth:sb.width};
            });
            if (sort.maxHeight === 'none' || sort.overflowY !== 'auto') throw new Error(`${width}px sort height/overflow mismatch`);
            if (sort.scrollbarWidth === 'auto' || sort.scrollbarWidth === '0px') throw new Error(`${width}px custom sort scrollbar missing: ${JSON.stringify(sort)}`);

            const modalButton = page.locator('#car-lead-modal .car-lead-modal__submit');
            const classes = await modalButton.getAttribute('class');
            if (!classes?.includes('button--primary') || !classes?.includes('button--inverse') || classes.includes('button--signal')) {
              throw new Error(`${width}px modal submit classes mismatch: ${classes}`);
            }
            const buttonStyles = await modalButton.evaluate(node => {
              const s = getComputedStyle(node);
              return {background:s.backgroundColor,color:s.color,minHeight:s.minHeight,width:s.width};
            });
            if (errors.length) throw new Error(`${width}px console errors: ${errors.join(' | ')}`);
            console.log(JSON.stringify({width,filter,sort,buttonStyles}));
            await context.close();
          }

          await browser.close();
          JS
          node mobile-ui-test.mjs

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-kit/styles.css live/index.html
          git commit -m "style Cars scrollbars and align modal submit"
          git push origin HEAD:main
